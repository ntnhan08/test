<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Editor Pro</title>
    <link rel="icon" href="logo.png" type="image/png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.15/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.15/theme/material-darker.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.15/addon/hint/show-hint.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.15/addon/fold/foldgutter.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.15/addon/lint/lint.min.css">
    <style>
        :root {
            --primary-color: #4a6ee0;
            --secondary-color: #6c757d;
            --dark-color: #2d3748;
            --light-color: #f8f9fa;
            --success-color: #10b981;
            --error-color: #ef4444;
            --warning-color: #f59e0b;
            --border-radius: 8px;
            --shadow: 0 4px 12px rgba(0, 0, 0, 0.1);
            --transition: all 0.3s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #1a1a1a;
            color: #e0e0e0;
            line-height: 1.6;
            overflow-x: hidden;
            height: 100vh;
        }

        .container {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        .mobile-tabs {
            display: none;
            background: #252525;
            border-bottom: 1px solid #333;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .mobile-tab {
            flex: 1;
            text-align: center;
            padding: 14px;
            cursor: pointer;
            font-weight: 600;
            transition: var(--transition);
            font-size: 1rem;
            position: relative;
        }

        .mobile-tab.active {
            background: var(--primary-color);
            color: white;
        }

        .mobile-tab.has-error::after {
            content: '';
            position: absolute;
            top: 8px;
            right: 8px;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: var(--error-color);
        }

        .editor-preview-container {
            display: flex;
            flex: 1;
            overflow: hidden;
            position: relative;
        }

        .code-section, .preview-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            transition: var(--transition);
            min-height: 400px;
        }

        .preview-section {
            background: white;
            border-left: 1px solid #333;
        }

        .section-header {
            background: #252525;
            color: white;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333;
            min-height: 50px;
        }

        .section-title {
            font-weight: 600;
            font-size: 1.1rem;
        }

        .error-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
            color: var(--error-color);
        }

        .error-indicator.hidden {
            display: none;
        }

        .tab-container {
            display: flex;
            background: #252525;
            overflow-x: auto;
            border-bottom: 1px solid #333;
            scrollbar-width: thin;
            scrollbar-color: #444 #252525;
        }

        .tab-container::-webkit-scrollbar {
            height: 6px;
        }

        .tab-container::-webkit-scrollbar-track {
            background: #252525;
        }

        .tab-container::-webkit-scrollbar-thumb {
            background-color: #444;
            border-radius: 3px;
        }

        .tab {
            padding: 12px 18px;
            cursor: pointer;
            border-bottom: 3px solid transparent;
            transition: var(--transition);
            white-space: nowrap;
            font-size: 0.95rem;
            position: relative;
            min-width: 80px;
            text-align: center;
        }

        .tab.active {
            border-bottom-color: var(--primary-color);
            background: #1e1e1e;
            font-weight: 600;
        }

        .tab.has-error::after {
            content: '';
            position: absolute;
            top: 8px;
            right: 8px;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background-color: var(--error-color);
        }

        .tab-content {
            display: none;
            flex: 1;
            overflow: hidden;
            position: relative;
            transition: opacity 0.3s ease;
        }

        .tab-content.active {
            display: flex;
            opacity: 1;
        }

        .tab-content:not(.active) {
            opacity: 0;
            height: 0;
            overflow: hidden;
        }

        .CodeMirror {
            height: 100%;
            font-size: 14px;
            line-height: 1.5;
            width: 100% !important;
            max-width: 100% !important;
        }

        .CodeMirror-scroll {
            width: 100% !important;
            max-width: 100% !important;
        }

        .CodeMirror-lines {
            width: 100% !important;
        }

        .CodeMirror-line {
            width: 100% !important;
        }

        .CodeMirror-lint-mark-error {
            background-color: rgba(239, 68, 68, 0.1);
            border-bottom: 2px dotted var(--error-color);
        }

        .CodeMirror-lint-tooltip {
            background-color: #1e1e1e;
            border: 1px solid #333;
            border-radius: var(--border-radius);
            color: #e0e0e0;
            font-size: 0.9rem;
            max-width: 300px;
            padding: 8px 12px;
            z-index: 1000;
        }

        .preview-container {
            flex: 1;
            padding: 0;
            border: none;
            overflow: auto;
            position: relative;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: white;
        }

        .iframe-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 1.2rem;
            z-index: 10;
            display: none;
            animation: fadeIn 0.3s;
        }

        .iframe-overlay.active {
            display: flex;
        }

        .iframe-overlay::before {
            content: '';
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 1s infinite linear;
            margin-right: 10px;
        }

        .button-container {
            display: flex;
            justify-content: center;
            gap: 15px;
            padding: 15px;
            background: #252525;
            border-top: 1px solid #333;
            flex-wrap: wrap;
        }

        button {
            padding: 10px 20px;
            border: none;
            border-radius: var(--border-radius);
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.95rem;
            position: relative;
            overflow: hidden;
            transform: translate3d(0,0,0);
        }

        button::after {
            content: "";
            display: block;
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            pointer-events: none;
            background-image: radial-gradient(circle, #fff 10%, transparent 10.01%);
            background-repeat: no-repeat;
            background-position: 50%;
            transform: scale(10,10);
            opacity: 0;
            transition: transform .3s, opacity .5s;
        }

        button:active::after {
            transform: scale(0,0);
            opacity: .3;
            transition: 0s;
        }

        .run-btn {
            background: var(--primary-color);
            color: white;
            animation: glow 2s infinite alternate;
        }

        .run-btn:hover {
            background: #3a5ecf;
            transform: translateY(-2px);
            box-shadow: 0 0 20px var(--primary-color);
        }

        .clear-btn {
            background: var(--secondary-color);
            color: white;
        }

        .clear-btn:hover {
            background: #5a6268;
            transform: translateY(-2px);
        }

        .reset-btn {
            background: #dc3545;
            color: white;
        }

        .reset-btn:hover {
            background: #c82333;
            transform: translateY(-2px);
        }

        .error-panel {
            background: #2d1a1a;
            border-top: 1px solid #5c2c2c;
            color: #f8a5a5;
            padding: 12px 16px;
            font-size: 0.9rem;
            max-height: 120px;
            overflow-y: auto;
            display: none;
        }

        .error-panel.active {
            display: block;
        }

        .error-item {
            margin-bottom: 8px;
            display: flex;
            align-items: flex-start;
            gap: 8px;
        }

        .error-item:last-child {
            margin-bottom: 0;
        }

        .error-icon {
            color: var(--error-color);
            flex-shrink: 0;
            margin-top: 2px;
        }

        .error-message {
            flex: 1;
        }

        /* Responsive styles - nâng cấp cho mobile */
        @media (max-width: 768px) {
            .mobile-tabs {
                display: flex;
            }
            
            .preview-section {
                border-left: none;
            }
            
            .code-section, .preview-section {
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                z-index: 1;
            }
            
            .preview-section {
                transform: translateX(100%);
            }
            
            .code-section.active, .preview-section.active {
                transform: translateX(0);
                z-index: 2;
            }
            
            .button-container {
                position: fixed;
                bottom: 0;
                left: 0;
                width: 100%;
                z-index: 100;
                padding: 12px;
                gap: 10px;
                background: rgba(37, 37, 37, 0.95);
                backdrop-filter: blur(10px);
                border-top: 1px solid #444;
                box-shadow: 0 -5px 20px rgba(0,0,0,0.5);
            }
            
            button {
                flex: 1;
                padding: 12px 16px;
                font-size: 1rem;
                justify-content: center;
                border-radius: 30px; /* Bo tròn hơn cho mobile */
            }
            
            .run-btn {
                animation: none; /* Tắt glow trên mobile để nhẹ hơn */
                box-shadow: 0 4px 10px rgba(74, 110, 224, 0.5);
            }
            
            .tab {
                padding: 10px 14px;
                font-size: 0.9rem;
                min-width: 70px;
            }
            
            .section-header {
                padding: 10px 16px;
                min-height: 46px;
            }
            
            .section-title {
                font-size: 1rem;
            }
            
            .error-panel {
                max-height: 100px;
                padding: 10px 12px;
                font-size: 0.85rem;
            }
        }

        @media (max-width: 480px) {
            .tab-container {
                padding: 0 8px;
            }
            
            .tab {
                padding: 10px 12px;
                font-size: 0.85rem;
                min-width: 60px;
            }
            
            .button-container {
                padding: 10px;
            }
            
            button {
                padding: 10px 12px;
                font-size: 0.9rem;
            }
            
            .mobile-tab {
                padding: 12px 10px;
                font-size: 0.9rem;
            }
        }

        @media (max-width: 360px) {
            .tab {
                padding: 8px 10px;
                font-size: 0.8rem;
                min-width: 55px;
            }
            
            .button-container {
                flex-direction: column;
            }
            
            button {
                width: 100%;
            }
        }

        /* Siêu hiệu ứng bổ sung */
        @keyframes glow {
            from { box-shadow: 0 0 10px -5px var(--primary-color); }
            to { box-shadow: 0 0 20px 5px var(--primary-color); }
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* Hiệu ứng hover cho tab */
        .tab:hover {
            background: #2a2a2a;
        }

        /* Hiệu ứng lỗi nhấp nháy nhẹ */
        .has-error {
            animation: errorPulse 1.5s infinite;
        }

        @keyframes errorPulse {
            0% { border-bottom-color: transparent; }
            50% { border-bottom-color: var(--error-color); }
            100% { border-bottom-color: transparent; }
        }
    </style>
</head>

            </div>

            <div class="preview-section">

        </div>

        <div class="button-container">
            <button class="run-btn" id="run-btn">
                 Chạy Mã
            </button>
            <button class="clear-btn" id="clear-btn">
                 Xóa Tất Cả
            </button>
            <button class="reset-btn" id="reset-btn">
                 Đặt Lại
            </button>
        </div>
    </div>

    <script>
        // Khởi tạo CodeMirror editors với gợi ý code và tự động thụt đầu dòng
        const htmlEditor = CodeMirror.fromTextArea(document.getElementById('html-code'), {
            mode: 'htmlmixed',
            theme: 'material-darker',
            lineNumbers: true,
            autoCloseTags: true,
            matchTags: true,
            matchBrackets: true,
            lineWrapping: true,
            indentUnit: 4,
            smartIndent: true,
            indentWithTabs: false,
            foldGutter: true,
            gutters: ["CodeMirror-linenumbers", "CodeMirror-foldgutter"],
            styleActiveLine: true,
            showTrailingSpace: true,
            extraKeys: {
                "Tab": function(cm) {
                    if (cm.somethingSelected()) {
                        cm.indentSelection("add");
                    } else {
                        cm.replaceSelection(Array(cm.getOption("indentUnit") + 1).join(" "), "end", "+input");
                    }
                },
                "Shift-Tab": function(cm) {
                    cm.indentSelection("subtract");
                },
                "'<'": function(cm) {
                    cm.closeTag(cm, '>');
                },
                "'/'": function(cm) {
                    cm.closeTag(cm, '>');
                },
                "'{'": function(cm) {
                    cm.closeTag(cm, '}');
                },
                "'('": function(cm) {
                    cm.closeTag(cm, ')');
                },
                "'['": function(cm) {
                    cm.closeTag(cm, ']');
                },
                "Ctrl-Space": "autocomplete",
                "Alt-Space": "autocomplete",
                "Ctrl-Q": function(cm) { cm.foldCode(cm.getCursor()); },
                "Ctrl-/": function(cm) { cm.toggleComment(); },
                "Cmd-/": function(cm) { cm.toggleComment(); }
            },
            hintOptions: {
                completeSingle: false
            }

        const cssEditor = CodeMirror.fromTextArea(document.getElementById('css-code'), {

        const jsEditor = CodeMirror.fromTextArea(document.getElementById('js-code'), {

            indentWithTabs: false,
            foldGutter: true,
            gutters: ["CodeMirror-linenumbers", "CodeMirror-foldgutter", "CodeMirror-lint-markers"],
            styleActiveLine: true,
            showTrailingSpace: true,
            lint: {
                getAnnotations: CodeMirror.lint.javascript,
                options: {
                    esversion: 6,
                    undef: true,
                    unused: true
                },
                async: true
            },
            extraKeys: {
                "Tab": function(cm) {
                    if (cm.somethingSelected()) {
                        cm.indentSelection("add");
                    } else {
                        cm.replaceSelection(Array(cm.getOption("indentUnit") + 1).join(" "), "end", "+input");
                    }
                },
                "Shift-Tab": function(cm) {
                    cm.indentSelection("subtract");
                },
                "Ctrl-Space": "autocomplete",
                "Alt-Space": "autocomplete",
                "Ctrl-/": function(cm) { cm.toggleComment(); },
                "Cmd-/": function(cm) { cm.toggleComment(); }
            },
            hintOptions: {
                completeSingle: false
            }
        });

        // Tự động hiển thị gợi ý khi nhập
        htmlEditor.on("inputRead", function(cm, change) {
            if (change.text.length > 0 && change.text[0].length > 0) {
                CodeMirror.commands.autocomplete(cm, null, {completeSingle: false});
            }
        });

        cssEditor.on("inputRead", function(cm, change) {
            if (change.text.length > 0 && change.text[0].length > 0) {
                CodeMirror.commands.autocomplete(cm, null, {completeSingle: false});
            }
        });

        jsEditor.on("inputRead", function(cm, change) {
            if (change.text.length > 0 && change.text[0].length > 0) {
                CodeMirror.commands.autocomplete(cm, null, {completeSingle: false});
            }
        });

        // Xử lý paste cho mobile - đảm bảo dán được code dài
        function setupPasteHandler(editor) {
            editor.on('paste', (cm, event) => {
                event.preventDefault();
                let text = event.clipboardData.getData('text/plain');
                if (text) {
                    let cursor = editor.getCursor();
                    editor.replaceRange(text, cursor);
                }
            });
        }
        setupPasteHandler(htmlEditor);
        setupPasteHandler(cssEditor);
        setupPasteHandler(jsEditor);

        // Tab switching functionality
        const tabs = document.querySelectorAll('.tab');
        const tabContents = document.querySelectorAll('.tab-content');

        tabs.forEach(tab => {
            tab.addEventListener('click', () => {
                // Remove active class from all tabs and contents
                tabs.forEach(t => t.classList.remove('active'));
                tabContents.forEach(c => c.classList.remove('active'));
                
                // Add active class to clicked tab and corresponding content
                tab.classList.add('active');
                const tabId = tab.getAttribute('data-tab');
                document.getElementById(`${tabId}-content`).classList.add('active');
                
                // Refresh the editor to ensure proper rendering
                setTimeout(() => {
                    if (tabId === 'html') htmlEditor.refresh();
                    if (tabId === 'css') cssEditor.refresh();
                    if (tabId === 'js') jsEditor.refresh();
                }, 10);
            });
        });

        // Mobile tab switching
        const mobileTabs = document.querySelectorAll('.mobile-tab');
        const codeSection = document.querySelector('.code-section');
        const previewSection = document.querySelector('.preview-section');

        mobileTabs.forEach(tab => {
            tab.addEventListener('click', () => {
                mobileTabs.forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                
                const tabType = tab.getAttribute('data-tab');
                if (tabType === 'code') {
                    codeSection.classList.add('active');
                    previewSection.classList.remove('active');
                } else {
                    codeSection.classList.remove('active');
                    previewSection.classList.add('active');
                }
            });
        });

        // Run code functionality
        const runBtn = document.getElementById('run-btn');
        const clearBtn = document.getElementById('clear-btn');
        const resetBtn = document.getElementById('reset-btn');
        const previewFrame = document.getElementById('preview-frame');
        const iframeOverlay = document.getElementById('iframe-overlay');
        const errorIndicator = document.getElementById('error-indicator');
        const errorCount = document.getElementById('error-count');
        const errorPanel = document.getElementById('error-panel');

        // Hàm kiểm tra lỗi
        function checkForErrors() {
            let totalErrors = 0;
            const allErrors = [];
            
            // Kiểm tra lỗi HTML cơ bản
            const htmlCode = htmlEditor.getValue();
            const htmlErrors = validateHTML(htmlCode);
            totalErrors += htmlErrors.length;
            allErrors.push(...htmlErrors.map(e => ({...e, type: 'HTML'})));
            
            // Lỗi CSS và JS được phát hiện bởi CodeMirror lint
            const cssState = cssEditor.state.lint.marked;
            const jsState = jsEditor.state.lint.marked;
            
            if (cssState && cssState.length > 0) {
                totalErrors += cssState.length;
                allErrors.push(...cssState.map(m => ({
                    message: m.message,
                    type: 'CSS',
                    line: m.from.line + 1
                })));
            }
            
            if (jsState && jsState.length > 0) {
                totalErrors += jsState.length;
                allErrors.push(...jsState.map(m => ({
                    message: m.message,
                    type: 'JavaScript',
                    line: m.from.line + 1
                })));
            }
            
            // Cập nhật giao diện hiển thị lỗi
            updateErrorDisplay(totalErrors, allErrors);
            
            return totalErrors;
        }
        
        // Hàm kiểm tra HTML cơ bản
        function validateHTML(html) {
            const errors = [];
            
            // Kiểm tra thẻ đóng mở cơ bản
            const openTags = html.match(/<(\w+)[^>]*>/g) || [];
            const closeTags = html.match(/<\/(\w+)>/g) || [];
            
            // Đếm số lượng thẻ mở và đóng
            const tagCount = {};
            
            openTags.forEach(tag => {
                const tagName = tag.match(/<(\w+)/)[1].toLowerCase();
                if (tagName !== 'br' && tagName !== 'hr' && tagName !== 'img' && tagName !== 'meta' && tagName !== 'link') {
                    tagCount[tagName] = (tagCount[tagName] || 0) + 1;
                }
            });
            
            closeTags.forEach(tag => {
                const tagName = tag.match(/<\/(\w+)>/)[1].toLowerCase();
                if (tagCount[tagName]) {
                    tagCount[tagName]--;
                } else {
                    errors.push({
                        message: `Thẻ đóng </${tagName}> không có thẻ mở tương ứng`,
                        line: findLineNumber(html, tag)
                    });
                }
            });
            
            // Kiểm tra thẻ mở không đóng
            Object.keys(tagCount).forEach(tagName => {
                if (tagCount[tagName] > 0) {
                    errors.push({
                        message: `Thẻ mở <${tagName}> không có thẻ đóng tương ứng`,
                        line: findLineNumber(html, `<${tagName}`)
                    });
                }
            });
            
            return errors;
        }
        
        // Tìm số dòng của một chuỗi trong mã nguồn
        function findLineNumber(text, searchString) {
            const lines = text.split('\n');
            for (let i = 0; i < lines.length; i++) {
                if (lines[i].includes(searchString)) {
                    return i + 1;
                }
            }
            return 1;
        }
        
        // Cập nhật hiển thị lỗi
        function updateErrorDisplay(errorCount, errors) {
            // Cập nhật chỉ báo lỗi
            if (errorCount > 0) {
                errorIndicator.classList.remove('hidden');
                errorCount.textContent = `${errorCount} lỗi`;
            } else {
                errorIndicator.classList.add('hidden');
            }
            
            // Cập nhật tab lỗi
            tabs.forEach(tab => {
                const tabType = tab.getAttribute('data-tab');
                const hasError = errors.some(e => e.type.toLowerCase() === tabType);
                
                if (hasError) {
                    tab.classList.add('has-error');
                } else {
                    tab.classList.remove('has-error');
                }
            });
            
            // Cập nhật mobile tab lỗi
            const hasAnyError = errorCount > 0;
            const codeMobileTab = document.querySelector('.mobile-tab[data-tab="code"]');
            if (hasAnyError) {
                codeMobileTab.classList.add('has-error');
            } else {
                codeMobileTab.classList.remove('has-error');
            }
            
            // Cập nhật panel lỗi
            if (errorCount > 0) {
                errorPanel.classList.add('active');
                errorPanel.innerHTML = '';
                
                errors.forEach(error => {
                    const errorItem = document.createElement('div');
                    errorItem.className = 'error-item';
                    
                    const errorIcon = document.createElement('div');
                    errorIcon.className = 'error-icon';
                    errorIcon.textContent = '●';
                    
                    const errorMessage = document.createElement('div');
                    errorMessage.className = 'error-message';
                    errorMessage.textContent = `[${error.type}] Dòng ${error.line}: ${error.message}`;
                    
                    errorItem.appendChild(errorIcon);
                    errorItem.appendChild(errorMessage);
                    errorPanel.appendChild(errorItem);
                });
            } else {
                errorPanel.classList.remove('active');
            }
        }

        function runCode() {
            // Hiển thị overlay tải
            iframeOverlay.classList.add('active');
            
            // Kiểm tra lỗi trước khi chạy
            const errorCount = checkForErrors();
            
            const html = htmlEditor.getValue();
            const css = cssEditor.getValue();
            const js = jsEditor.getValue();
            
            const previewDocument = previewFrame.contentDocument || previewFrame.contentWindow.document;
            
            // Tạo tài liệu HTML hoàn chỉnh với mã được cung cấp
            const fullHtml = `
                <!DOCTYPE html>
                <html>
                <head>
                    <meta charset="UTF-8">
                    <meta name="viewport" content="width=device-width, initial-scale=1.0">
                    <style>${css}</style>
                </head>
                <body>
                    ${html}
                    <script>${js}<\/script>
                </body>
                </html>
            `;
            
            previewDocument.open();
            previewDocument.write(fullHtml);
            previewDocument.close();
            
            // Ẩn overlay sau khi tải xong
            setTimeout(() => {
                iframeOverlay.classList.remove('active');
            }, 500);
        }

        function clearAllCode() {
            if (confirm('Bạn có chắc chắn muốn xóa tất cả mã? Hành động này không thể hoàn tác.')) {
                htmlEditor.setValue('');
                cssEditor.setValue('');
                jsEditor.setValue('');
                runCode();
            }
        }

        function resetToDefault() {
            if (confirm('Bạn có muốn đặt lại tất cả về trạng thái ban đầu?')) {
                htmlEditor.setValue(`<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang web của tôi</title>
</head>
<body>
    <h1>Xin chào!</h1>
    <p>Đây là trang web được tạo bằng trình soạn thảo HTML.</p>
</body>
</html>`);
                cssEditor.setValue(`/* 
 * TRÌNH SOẠN THẢO CSS
 * 
 * Nhập mã CSS của bạn vào đây. CSS sẽ được áp dụng trực tiếp vào trang HTML.
 * 
 * Ví dụ:
 * - Để thay đổi màu nền: body { background-color: #f0f0f0; }
 * - Để thay đổi font chữ: body { font-family: Arial, sans-serif; }
 * - Để tạo hiệu ứng hover: button:hover { background-color: #4a6ee0; }
 * 
 * CSS được viết theo cú pháp: selector { property: value; }
 */

/* Bắt đầu viết CSS của bạn từ đây */`);
                jsEditor.setValue(`/* 
 * TRÌNH SOẠN THẢO JAVASCRIPT
 * 
 * Nhập mã JavaScript của bạn vào đây. JS sẽ được thực thi trên trang HTML.
 * 
 * Ví dụ:
 * - Hiển thị thông báo: alert('Xin chào!');
 * - Thay đổi nội dung: document.getElementById('id').innerHTML = 'Nội dung mới';
 * - Xử lý sự kiện: element.addEventListener('click', function() { ... });
 * 
 * Mẹo: Sử dụng console.log() để in ra kết quả kiểm tra
 */

// Bắt đầu viết JavaScript của bạn từ đây`);
                runCode();
            }
        }

        // --- TỰ ĐỘNG CHẠY MÃ KHI NHẬP XONG ---
        let autoRunTimeout;
        [htmlEditor, cssEditor, jsEditor].forEach(editor => {
            editor.on('change', () => {
                clearTimeout(autoRunTimeout);
                autoRunTimeout = setTimeout(() => {
                    runCode();  // tự động chạy code sau 1.5 giây dừng gõ
                }, 1500);
            });
        });

        // Event listeners - có clearTimeout để tránh chạy trùng
        runBtn.addEventListener('click', () => {
            clearTimeout(autoRunTimeout);
            runCode();
        });
        clearBtn.addEventListener('click', () => {
            clearTimeout(autoRunTimeout);
            clearAllCode();
        });
        resetBtn.addEventListener('click', () => {
            clearTimeout(autoRunTimeout);
            resetToDefault();
        });

        // Chạy code khi tải trang
        document.addEventListener('DOMContentLoaded', runCode);
        
        // Xử lý thay đổi kích thước màn hình
        window.addEventListener('resize', function() {
            [htmlEditor, cssEditor, jsEditor].forEach(editor => {
                editor.refresh();
            });
        });
    </script>
</body>
</html>

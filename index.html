<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>🍳 BẾP TRƯỞNG · ĐƠN GIẢN & MƯỢT</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background: #1a2e3c;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', Roboto, sans-serif;
            touch-action: none;
        }
        .game-wrapper {
            position: relative;
            width: 100%;
            max-width: 600px;
            aspect-ratio: 1 / 1;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 3px solid #ff9800;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 30% 30%, #3a6d8c, #1a2e3c);
            touch-action: none;
        }
        #ui {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            pointer-events: none;
            z-index: 10;
        }
        .top-bar {
            display: flex;
            justify-content: space-between;
            padding: 12px;
        }
        .badge {
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(4px);
            color: #ffdba4;
            padding: 6px 16px;
            border-radius: 30px;
            font-weight: bold;
            font-size: 16px;
            border: 1px solid #ffb74d;
        }
        #inventory {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(4px);
            color: white;
            padding: 10px 20px;
            border-radius: 40px;
            font-size: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        #hint {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: rgba(0,0,0,0.5);
            color: #ffb86b;
            padding: 8px 16px;
            border-radius: 30px;
            font-size: 14px;
            border: 1px solid #ff9800;
        }
        #message {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.7);
            color: #ffb347;
            padding: 12px 24px;
            border-radius: 40px;
            font-weight: bold;
            font-size: 20px;
            display: none;
            white-space: nowrap;
            border: 1px solid #ff9800;
        }
    </style>
</head>
<body>
<div class="game-wrapper">
    <canvas id="canvas" width="600" height="600"></canvas>
    <div id="ui">
        <div class="top-bar">
            <div class="badge">💰 <span id="money">250</span></div>
            <div class="badge">⭐ <span id="rep">100</span></div>
        </div>
        <div id="inventory">🎒 <span id="invText">Trống</span></div>
        <div id="hint">👆 Chạm để di chuyển / tương tác</div>
        <div id="message"></div>
    </div>
</div>

<script>
    (function(){
        "use strict";

        // --- CANVAS ---
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const moneySpan = document.getElementById('money');
        const repSpan = document.getElementById('rep');
        const invSpan = document.getElementById('invText');
        const msgDiv = document.getElementById('message');

        // Kích thước cố định 600x600 cho đơn giản
        const W = 600, H = 600;
        canvas.width = W; canvas.height = H;

        // --- DỮ LIỆU GAME ---
        let money = 250;
        let reputation = 100;

        const chef = {
            x: 300, y: 300, r: 18,
            inventory: null
        };

        // Các trạm (hitbox hình chữ nhật)
        const fridge = { x: 50, y: 50, w: 70, h: 70 };
        const board = { x: 200, y: 100, w: 90, h: 60, active: false, progress: 0, max: 120 };
        const stove = { x: 150, y: 400, w: 120, h: 80, active: false, progress: 0, max: 180, ready: false };
        const trash = { x: 480, y: 480, w: 60, h: 60 };
        const table = { x: 400, y: 200, w: 100, h: 70 };

        // Khách
        let customer = null;
        const MAX_PATIENCE = 200;

        // Di chuyển
        let target = null;
        const SPEED = 3;

        // Tin nhắn tạm
        let messageTimer = 0;

        // --- TIỆN ÍCH ---
        function showMessage(text, isGood = true) {
            msgDiv.style.display = 'block';
            msgDiv.textContent = text;
            msgDiv.style.color = isGood ? '#ffb347' : '#ff6b6b';
            messageTimer = 60;
        }

        function updateUI() {
            moneySpan.textContent = money;
            repSpan.textContent = reputation;
            if (chef.inventory) {
                invSpan.textContent = chef.inventory.icon + ' ' + (chef.inventory.name || '');
            } else {
                invSpan.textContent = 'Trống';
            }
        }

        // Kiểm tra va chạm hình tròn với hình chữ nhật
        function collides(cx, cy, r, rect) {
            const nearestX = Math.max(rect.x, Math.min(cx, rect.x + rect.w));
            const nearestY = Math.max(rect.y, Math.min(cy, rect.y + rect.h));
            const dx = cx - nearestX;
            const dy = cy - nearestY;
            return (dx*dx + dy*dy) < r*r;
        }

        function isChefNear(rect, extra = 0) {
            return collides(chef.x, chef.y, chef.r + extra, rect);
        }

        // Tương tác khi chạm vào màn hình (gọi từ sự kiện)
        function tryInteract() {
            // Tủ lạnh
            if (isChefNear(fridge, 10)) {
                if (!chef.inventory) {
                    chef.inventory = { type: 'ingredient', icon: '🍅', name: 'Cà chua' };
                    showMessage('Đã lấy 🍅');
                    updateUI();
                    return true;
                } else {
                    showMessage('Tay đang cầm đồ!', false);
                    return true;
                }
            }

            // Thớt
            if (isChefNear(board, 10)) {
                if (chef.inventory && chef.inventory.type === 'ingredient' && !board.active) {
                    board.active = true;
                    board.progress = 0;
                    chef.inventory = null;
                    showMessage('Đang thái...');
                    updateUI();
                    return true;
                } else if (board.active) {
                    showMessage('Thớt đang bận', false);
                    return true;
                } else {
                    showMessage('Cần nguyên liệu', false);
                    return true;
                }
            }

            // Bếp
            if (isChefNear(stove, 15)) {
                if (stove.ready && !chef.inventory) {
                    chef.inventory = { type: 'dish', icon: '🍕', name: 'Pizza' };
                    stove.ready = false;
                    showMessage('Đã lấy Pizza!');
                    updateUI();
                    return true;
                }
                if (board.active && board.progress >= board.max && !stove.active && !stove.ready) {
                    stove.active = true;
                    stove.progress = 0;
                    board.active = false;
                    showMessage('Bắt đầu nấu 🍕');
                    return true;
                }
                if (stove.active) {
                    showMessage('Bếp đang nấu', false);
                    return true;
                }
                if (stove.ready && chef.inventory) {
                    showMessage('Tay đang cầm đồ!', false);
                    return true;
                }
                showMessage('Chưa có gì để nấu', false);
                return true;
            }

            // Thùng rác
            if (isChefNear(trash, 10)) {
                if (chef.inventory) {
                    chef.inventory = null;
                    showMessage('Đã vứt đồ');
                    updateUI();
                } else {
                    showMessage('Tay trống', false);
                }
                return true;
            }

            // Giao đồ cho khách
            if (customer && customer.state === 'waiting') {
                const dist = Math.hypot(chef.x - customer.x, chef.y - customer.y);
                if (dist < 50 && chef.inventory && chef.inventory.type === 'dish') {
                    money += 20;
                    reputation = Math.min(100, reputation + 5);
                    chef.inventory = null;
                    customer.state = 'leaving';
                    showMessage('Giao món +20$');
                    updateUI();
                    return true;
                }
            }

            return false;
        }

        // Xử lý chạm
        function handleStart(e) {
            e.preventDefault();
            const rect = canvas.getBoundingClientRect();
            const scaleX = W / rect.width;
            const scaleY = H / rect.height;

            let clientX, clientY;
            if (e.touches) {
                clientX = e.touches[0].clientX;
                clientY = e.touches[0].clientY;
            } else {
                clientX = e.clientX;
                clientY = e.clientY;
            }

            const canvasX = (clientX - rect.left) * scaleX;
            const canvasY = (clientY - rect.top) * scaleY;

            // Thử tương tác trước
            if (tryInteract()) return;

            // Nếu không, đặt điểm đến
            target = { x: Math.min(W-30, Math.max(30, canvasX)), y: Math.min(H-30, Math.max(30, canvasY)) };
        }

        // Cập nhật game
        function update() {
            // Di chuyển
            if (target) {
                const dx = target.x - chef.x;
                const dy = target.y - chef.y;
                const dist = Math.hypot(dx, dy);
                if (dist < 5) {
                    target = null;
                } else {
                    const step = Math.min(dist, SPEED);
                    chef.x += (dx / dist) * step;
                    chef.y += (dy / dist) * step;
                }
            }

            // Tiến trình thái
            if (board.active) {
                board.progress += 1;
                if (board.progress >= board.max) {
                    board.active = false;
                    showMessage('Thái xong!');
                }
            }

            // Tiến trình nấu
            if (stove.active) {
                stove.progress += 1;
                if (stove.progress >= stove.max) {
                    stove.active = false;
                    stove.ready = true;
                    showMessage('Nấu xong! Chạm bếp để lấy');
                }
            }

            // Khách hàng
            if (!customer && Math.random() < 0.01) {
                customer = {
                    x: 450, y: 250,
                    state: 'waiting',
                    patience: MAX_PATIENCE,
                    maxPatience: MAX_PATIENCE,
                    order: '🍕'
                };
            }

            if (customer) {
                if (customer.state === 'waiting') {
                    customer.patience -= 1;
                    if (customer.patience <= 0) {
                        reputation = Math.max(0, reputation - 10);
                        showMessage('Khách bỏ đi! -10', false);
                        customer = null;
                        updateUI();
                    }
                } else if (customer.state === 'leaving') {
                    customer = null;
                }
            }

            // Tin nhắn
            if (messageTimer > 0) {
                messageTimer--;
                if (messageTimer === 0) msgDiv.style.display = 'none';
            }

            updateUI();
        }

        // Vẽ
        function draw() {
            ctx.clearRect(0, 0, W, H);

            // Lưới
            ctx.strokeStyle = '#5f8aa0';
            ctx.lineWidth = 1;
            ctx.globalAlpha = 0.3;
            for (let i=0; i<W; i+=40) {
                ctx.beginPath();
                ctx.moveTo(i,0); ctx.lineTo(i,H);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(0,i); ctx.lineTo(W,i);
                ctx.stroke();
            }
            ctx.globalAlpha = 1.0;

            // Tủ lạnh
            ctx.fillStyle = '#7cb9e8';
            ctx.fillRect(fridge.x, fridge.y, fridge.w, fridge.h);
            ctx.fillStyle = '#fff';
            ctx.font = '30px "Segoe UI"';
            ctx.fillText('🧊', fridge.x+20, fridge.y+45);

            // Thớt
            ctx.fillStyle = '#b89b7b';
            ctx.fillRect(board.x, board.y, board.w, board.h);
            if (board.active) {
                ctx.fillStyle = '#ff9800';
                ctx.fillRect(board.x+5, board.y+5, (board.progress/board.max)*(board.w-10), 8);
            }

            // Bếp
            ctx.fillStyle = '#5a6b7a';
            ctx.fillRect(stove.x, stove.y, stove.w, stove.h);
            ctx.fillStyle = '#444';
            ctx.beginPath();
            ctx.ellipse(stove.x+60, stove.y+40, 30, 20, 0, 0, Math.PI*2);
            ctx.fill();
            if (stove.active) {
                ctx.fillStyle = '#f44336';
                ctx.fillRect(stove.x+10, stove.y+5, (stove.progress/stove.max)*(stove.w-20), 8);
                ctx.fillStyle = '#ff8c00';
                ctx.beginPath();
                ctx.ellipse(stove.x+60, stove.y+30, 15, 10, 0, 0, Math.PI*2);
                ctx.fill();
            } else if (stove.ready) {
                ctx.fillStyle = '#4caf50';
                ctx.beginPath();
                ctx.ellipse(stove.x+60, stove.y+30, 20, 15, 0, 0, Math.PI*2);
                ctx.fill();
                ctx.fillStyle = '#fff';
                ctx.font = 'bold 20px "Segoe UI"';
                ctx.fillText('✅', stove.x+50, stove.y+25);
            } else {
                ctx.fillStyle = '#ff8c00';
                ctx.beginPath();
                ctx.ellipse(stove.x+60, stove.y+30, 12, 8, 0, 0, Math.PI*2);
                ctx.fill();
            }

            // Thùng rác
            ctx.fillStyle = '#6d4c41';
            ctx.fillRect(trash.x, trash.y, trash.w, trash.h);
            ctx.fillStyle = '#fff';
            ctx.font = '24px "Segoe UI"';
            ctx.fillText('🗑️', trash.x+18, trash.y+40);

            // Bàn
            ctx.fillStyle = '#8b5e3c';
            ctx.fillRect(table.x, table.y, table.w, table.h);

            // Khách
            if (customer) {
                ctx.fillStyle = '#6a8d73';
                ctx.beginPath();
                ctx.arc(customer.x, customer.y, 18, 0, 2*Math.PI);
                ctx.fill();
                ctx.fillStyle = '#f5dbb1';
                ctx.beginPath();
                ctx.arc(customer.x, customer.y-20, 14, 0, 2*Math.PI);
                ctx.fill();
                if (customer.state === 'waiting') {
                    const patiencePercent = customer.patience / customer.maxPatience;
                    ctx.fillStyle = '#fff8e7';
                    ctx.beginPath();
                    ctx.ellipse(customer.x-20, customer.y-50, 25, 18, 0, 0, Math.PI*2);
                    ctx.fill();
                    ctx.fillStyle = `hsl(${patiencePercent * 120}, 80%, 60%)`;
                    ctx.font = 'bold 24px "Segoe UI"';
                    ctx.fillText(customer.order, customer.x-35, customer.y-45);
                }
            }

            // Đầu bếp
            ctx.fillStyle = '#f8f8f8';
            ctx.beginPath();
            ctx.arc(chef.x, chef.y-4, chef.r, 0, 2*Math.PI);
            ctx.fill();
            ctx.fillStyle = '#f5dbb1';
            ctx.beginPath();
            ctx.arc(chef.x, chef.y-22, 14, 0, 2*Math.PI);
            ctx.fill();
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(chef.x, chef.y-38, 12, 0, 2*Math.PI);
            ctx.fill();
            if (chef.inventory) {
                ctx.font = '24px "Segoe UI"';
                ctx.fillStyle = '#000';
                ctx.fillText(chef.inventory.icon, chef.x+15, chef.y-25);
            }

            // Điểm đến
            if (target) {
                ctx.strokeStyle = '#ffaa00';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.arc(target.x, target.y, 12, 0, 2*Math.PI);
                ctx.stroke();
            }
        }

        // Game loop
        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        // Sự kiện
        canvas.addEventListener('touchstart', handleStart, { passive: false });
        canvas.addEventListener('mousedown', handleStart);
        canvas.addEventListener('touchmove', (e) => e.preventDefault(), { passive: false });
        canvas.addEventListener('touchend', (e) => e.preventDefault());

        // Khởi động
        updateUI();
        loop();
    })();
</script>
</body>
</html>
